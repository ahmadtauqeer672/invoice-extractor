<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Invoice Data Extractor</title>

<style>

body{
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#eef2f3,#dfe9f3);
margin:0;
padding:40px;
display:flex;
justify-content:center;
}

.container{
width:800px;
}

.title{
text-align:center;
font-size:28px;
font-weight:bold;
margin-bottom:25px;
color:#333;
}

/* Upload Card */

.upload-card{
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
display:flex;
gap:10px;
align-items:center;
justify-content:center;
}

input[type=file]{
padding:14px;
font-size:16px;
border:1px solid #ccc;
border-radius:8px;
width:60%;
background:#f8f9fa;
}

.upload-btn{
background:#28a745;
color:white;
border:none;
padding:14px 26px;
font-size:16px;
border-radius:8px;
cursor:pointer;
font-weight:bold;
}

.upload-btn:hover{
background:#218838;
}

/* Table */

.table-card{
margin-top:25px;
background:white;
border-radius:10px;
box-shadow:0 4px 10px rgba(0,0,0,0.1);
padding:20px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#f1f3f5;
text-align:left;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

/* Copy Button */

.copy-btn{
background:#e9ecef;
border:none;
padding:6px 12px;
border-radius:6px;
cursor:pointer;
font-size:14px;
}

.copy-btn:hover{
background:#dee2e6;
}

.copied{
background:#28a745;
color:white;
}

/* Footer */

footer{
text-align:center;
margin-top:30px;
color:#555;
font-size:14px;
}

</style>

<script>

function copyText(button,value){

navigator.clipboard.writeText(value);

button.innerText="Copied ✓";
button.classList.add("copied");

setTimeout(()=>{
button.innerText="Copy";
button.classList.remove("copied");
},1500);

}

</script>

</head>


<body>

<div class="container">

<div class="title">
Invoice Data Extractor
</div>


<!-- Upload Block -->

<div class="upload-card">

<form method="POST" enctype="multipart/form-data">

<input type="file" name="pdf" required>

<button class="upload-btn" type="submit">
Upload
</button>

</form>

</div>


{% if data %}

<div class="table-card">

<table>

<tr>
<th>Field</th>
<th>Value</th>
<th></th>
</tr>

{% for key,value in data.items() %}

<tr>

<td>{{key}}</td>

<td>{{value}}</td>

<td>
<button class="copy-btn"
onclick="copyText(this,'{{value}}')">
Copy
</button>
</td>

</tr>

{% endfor %}

</table>

</div>

{% endif %}

<footer>

Developed by Ahmed Tauqeer ❤️ Inspired by Beloved Ujala Khan

</footer>

</div>

</body>

</html>
